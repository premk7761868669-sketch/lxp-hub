function P(){let act=0,sum=0,n=0,bars='';
 for(let i=6;i>=0;i--){const d=ds(i),L=S.log[d]||{};let c=0;
  EX.forEach(e=>{if(L[e.id]){c++;sum+=Math.min(1,L[e.id]/tgt(e));n++}});
  if(c)act++;
  const dn=['Ra','So','Ma','Bu','Gu','Shu','Sha'][new Date(d+'T00:00:00').getDay()];
  bars+=`<div><i style="height:${c/EX.length*90}px"></i>${dn}<br>${c}</div>`}
 const sc=Math.round(act/7*60+(n?sum/n:0)*40);
 const rk=sc>=85?['Legend 👑','Bohot badhiya! Aise hi chalte raho.']:sc>=65?['Warrior ⚔️','Strong consistency, bas thoda aur push.']:sc>=40?['Rising 🔥','Achha start hai, roz ka rhythm banao.']:['Beginner 🌱','Roz thoda karo — consistency hi king hai.'];
 const tot=EX.map(e=>{let t=0;Object.values(S.log).forEach(L=>t+=L[e.id]||0);return `<div class="row"><span>${e.e} ${e.n}</span><b>${t} ${e.u}</b></div>`}).join('');
 return `<h1>Progress 📊</h1><div class="card" style="text-align:center"><div class="mu">Weekly Score</div><div style="font-size:48px;font-weight:800">${sc}<span class="mu">/100</span></div><div style="font-size:18px;font-weight:700">${rk[0]}</div><div class="mu">${rk[1]}</div></div>
 <div class="card"><b>Pichle 7 din (kitni exercise hui)</b><div class="ch">${bars}</div><div class="mu" style="margin-top:8px">Active days: ${act}/7 · Streak: ${streak()} 🔥</div></div>
 <div class="card"><b>Total ab tak</b>${tot}</div>`}

function R(){const mx=Math.max(...EX.map(e=>lvl(e.id)));
 return `<h1>Rewards 🎁</h1><div class="mu">Level up karo, reward unlock karo!</div>`+RW.map(r=>`<div class="card ${mx>=r.l?'':'lk'}"><div class="row"><b>${r.i} ${r.n}</b><span class="pill">Lv ${r.l}</span></div><div>${mx>=r.l?'✅ '+r.r:'🔒 Kisi bhi exercise me Level '+r.l+' tak pahucho'}</div></div>`).join('')+
 (S.rw.length?`<h2>Tumne kamaye</h2>`+S.rw.slice().reverse().map(r=>`<div class="card"><b>${r.i} ${r.n}</b> <span class="mu">· ${EX.find(e=>e.id==r.id).n} Lv ${r.l} · ${r.d}</span></div>`).join(''):'')}

function render(){$('#v').innerHTML=tab=='t'?T():tab=='p'?P():tab=='m'?M():tab=='a'?A():R()+GM();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));const na=$('#na');if(na)na.style.display=S.adm?'':'none'}

let ph=0,stream=null,lp=null,bg=null,bn=0,face='user',win=[],sm=.5,stt=0,lastRep=0,secs=0,lt=0,ac=null,calT=0,wasPr=false,warm=0;
const W=80,H=60,vd=document.createElement('video');vd.muted=true;vd.playsInline=true;vd.style.cssText='position:fixed;opacity:0;width:1px;height:1px;pointer-events:none';document.body.appendChild(vd);
const oc=document.createElement('canvas');oc.width=W;oc.height=H;const ox=oc.getContext('2d',{willReadFrequently:true});
const mc=document.createElement('canvas');mc.width=W;mc.height=H;const mx2=mc.getContext('2d');
function oe(id){const x=EX.find(z=>z.id==id);if(x.pr&&!S.pr){tab='m';render();return}op=id;fb='';ph=0;cnt=0;sheet();$('#sh').style.display='block';$('#sh').scrollTop=0}
function stopCam(){clearInterval(lp);lp=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function ce(){stopCam();op=null;$('#sh').style.display='none';render()}
function sheet(){const e=EX.find(x=>x.id==op),t=tgt(e),g=got(ds(0),e.id);
 $('#shc').innerHTML=`<button class="g" onclick="ce()">← Wapas</button><h2>${e.e} ${e.n} <span class="pill">Lv ${lvl(e.id)}</span></h2>
 <div class="card"><div class="mu">Target: ${t} ${e.u} · Aaj ho gaya: ${g} · Level up: ${days(e.id)}/${DN} din</div><div class="bar"><i style="width:${Math.min(100,g/t*100)}%"></i></div>
 <div class="camw"><canvas id="cv" width="320" height="240"></canvas><div class="lc" id="lc">0</div></div>
 <div class="fb" id="st"></div><div class="cn" id="ct"></div><div class="fb" id="fb">${fb}</div>
 <div class="mu">📱 Phone ko side me stable rakho, poori body frame me, light achhi. Sirf camera me jo dikhega wahi count hoga — manual entry nahi.</div></div>
 <div class="card"><b>Kaise karein (${e.m})</b>${fig(e.p)}<ol>${e.st.map(s=>`<li>${s}</li>`).join('')}</ol><div class="mu">💡 ${e.tip}</div></div>`;ui()}
function ui(){const s=$('#st'),c=$('#ct');if(!c)return;
 const B=(f,t,g)=>`<button ${g?'class="g"':''} onclick="${f}">${t}</button>`;
 if(ld){s.textContent='⏳ Pose model load ho raha hai (pehli baar 10-20 sec)…';c.innerHTML='';return}
 if(ph==0){s.textContent='Camera band hai';c.innerHTML=B('cam()','📷 Camera shuru karo')}
 else if(ph==1){s.textContent=(plErr?'⚠️ Pose model nahi mila (internet?), simple mode. ':'')+'Pehle frame se bahar jao, phir Calibrate dabao';c.innerHTML=B('cal0()','🎯 Calibrate')+B('sw()','🔄',1)}
 else if(ph==2){c.innerHTML=''}
 else if(ph==3){s.textContent=PL?'Camera ready ✅ Poori body frame me laao, phir Start':'Calibrate ho gaya ✅ Ab frame me aao, position lo';c.innerHTML=B('go()','▶ Start')+(PL?'':B('cal0()','Re-calibrate',1))}
 else c.innerHTML=B('sd()','⏹ Stop & Save')}
async function cam(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(x){}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:face,width:{ideal:320},height:{ideal:240}},audio:false});
 vd.srcObject=stream;await vd.play();ph=1;ld=!PL&&!plErr;ui();if(ld){await loadPose();ld=false}ph=PL?3:1;clearInterval(lp);lp=setInterval(tick,80);ui()}
 catch(x){$('#st').textContent='❌ Camera nahi khula. Permission do, ya is link ko seedha Chrome/Safari me kholo.'}}
function sw(){face=face=='user'?'environment':'user';stopCam();cam()}
function cal0(){bg=null;bn=0;ph=2;calT=Date.now()+3000;ui()}
function go(){ps=null;ph=4;cnt=0;secs=0;win=[];stt=0;lt=Date.now();wasPr=false;warm=0;ui()}
function ping(){try{const o=ac.createOscillator();o.connect(ac.destination);o.frequency.value=880;o.start();o.stop(ac.currentTime+.08)}catch(x){}try{navigator.vibrate&&navigator.vibrate(35)}catch(x){}}
function tick(){if(!stream||vd.readyState<2)return;const cv=$('#cv');if(!cv)return;
 const e=EX.find(x=>x.id==op),c=cv.getContext('2d'),n=W*H;
 c.drawImage(vd,0,0,320,240);if(PL&&ph>=3){poseTick(e,c);return}ox.drawImage(vd,0,0,W,H);const d=ox.getImageData(0,0,W,H).data;c.drawImage(vd,0,0,320,240);
 if(ph==2){if(!bg)bg=new Float32Array(n);for(let i=0;i<n;i++)bg[i]+=(d[i*4]+d[i*4+1]+d[i*4+2])/3;bn++;
  $('#st').textContent='Calibrate ho raha hai… hilo mat ('+Math.max(0,Math.ceil((calT-Date.now())/1000))+')';
  if(Date.now()>=calT){for(let i=0;i<n;i++)bg[i]/=bn;ph=3;ui()}return}
 if(ph<3)return;
 const m=mx2.createImageData(W,H);let cn=0,sy=0;
 for(let i=0;i<n;i++){const g=(d[i*4]+d[i*4+1]+d[i*4+2])/3;if(Math.abs(g-bg[i])>32){cn++;sy+=Math.floor(i/W);m.data[i*4]=255;m.data[i*4+1]=122;m.data[i*4+2]=69;m.data[i*4+3]=130}}
 mx2.putImageData(m,0,0);c.drawImage(mc,0,0,320,240);
 const pr=cn/n>.05&&cn/n<.6;if(pr){sm=sm*.65+(sy/cn/H)*.35;c.fillStyle='#fff';c.fillRect(0,sm*240-1,320,2)}
 if(ph!=4)return;
 const now=Date.now();
 if(pr&&!wasPr){warm=now+1500;win=[];stt=0}if(!pr)win=[];wasPr=pr;
 if(e.u=='sec'){if(pr)secs+=(now-lt)/1000;lt=now;cnt=Math.floor(secs)}
 else if(pr&&now>warm){win.push(sm);if(win.length>50)win.shift();
  const mx=Math.max(...win),mn=Math.min(...win),a=mx-mn;
  if(a>.03){if(stt==0&&sm<mn+.3*a)stt=1;else if(stt==1&&sm>mx-.3*a&&now-lastRep>500){cnt++;lastRep=now;stt=0;ping()}}}
 $('#lc').textContent=cnt;$('#st').textContent=pr?'🟢 Dikh rahe ho — counting':'🔴 Frame me nahi dikh rahe — count ruka'}
let ps=null,PL=null,plErr=false,ld=false;
const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',PT={push:[100,150],ohp:[100,150],ofp:[100,150],squat:[110,160],lunge:[110,160],pull:[90,150],ohpu:[90,150]},AM={sit:25,burpee:.2};
const EL=[[11,13,15],[12,14,16]],KN=[[23,25,27],[24,26,28]],HP=[[11,23,25],[12,24,26]];
const SK=[[11,13],[13,15],[12,14],[14,16],[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
async function loadPose(){if(PL||plErr)return;try{const m=await import(V+'/vision_bundle.mjs'),f=await m.FilesetResolver.forVisionTasks(V+'/wasm');
 const mk=d=>m.PoseLandmarker.createFromOptions(f,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:d},runningMode:'VIDEO',numPoses:1});
 try{PL=await mk('GPU')}catch(x){PL=await mk('CPU')}}catch(x){plErr=true}}
const AN=(a,b,c)=>{const x=a.x-b.x,y=a.y-b.y,p=c.x-b.x,q=c.y-b.y,d=Math.hypot(x,y)*Math.hypot(p,q);return d?Math.acos(Math.max(-1,Math.min(1,(x*p+y*q)/d)))*180/Math.PI:180};
function val(e,L){const vi=i=>L[i].visibility||0,ang=s=>AN(L[s[0]],L[s[1]],L[s[2]]),ok=s=>Math.min(vi(s[0]),vi(s[1]),vi(s[2]))>.4;
 const best=S=>{let b=null,bv=0;for(const s of S){const m=Math.min(vi(s[0]),vi(s[1]),vi(s[2]));if(m>bv){bv=m;b=s}}return bv>.4?ang(b):null};
 const low=S=>{const r=S.filter(ok).map(ang);return r.length?Math.min(...r):null};
 switch(e.id){case 'push':case 'ohp':case 'ofp':return best(EL);case 'squat':case 'wall':return best(KN);case 'lunge':return low(KN);case 'pull':case 'ohpu':return low(EL);case 'sit':return best(HP);
 case 'burpee':return vi(0)>.4&&Math.max(vi(27),vi(28))>.3?(L[27].y+L[28].y)/2-L[0].y:null;
 case 'plank':return Math.max(vi(11),vi(12))>.3&&Math.max(vi(27),vi(28))>.3?Math.abs((L[11].y+L[12].y)/2-(L[27].y+L[28].y)/2):null}return null}
function poseTick(e,c){let L=null;try{const r=PL.detectForVideo(vd,performance.now());L=r.landmarks&&r.landmarks[0]}catch(x){}
 const now=Date.now(),v=L?val(e,L):null,pr=v!=null,s=$('#st');
 if(L){c.strokeStyle='#34d399';c.lineWidth=4;c.lineCap='round';for(const[a,b]of SK)if((L[a].visibility||0)>.4&&(L[b].visibility||0)>.4){c.beginPath();c.moveTo(L[a].x*320,L[a].y*240);c.lineTo(L[b].x*320,L[b].y*240);c.stroke()}}
 if(ph!=4){s.textContent=pr?'🟢 Body dikh rahi hai — Start dabao':'🔴 Poori body frame me laao';return}
 if(!pr){stt=0;lt=now;s.textContent='🔴 Body nahi dikh rahi — count ruka';return}
 if(e.u=='sec'){const ok=e.id=='plank'?v<.2:(v>70&&v<125);if(ok)secs+=(now-lt)/1000;lt=now;cnt=Math.floor(secs);s.textContent=ok?'🟢 Sahi position — time chal raha':'🟡 Sahi position lo ('+(e.id=='plank'?'body seedhi':'ghutne 90°')+')'}
 else{ps=ps==null?v:ps*.5+v*.5;const T=PT[e.id];
  if(T){if(stt==0&&ps<T[0])stt=1;else if(stt==1&&ps>T[1]&&now-lastRep>400){cnt++;lastRep=now;stt=0;ping()}}
  else{win.push(ps);if(win.length>50)win.shift();const mx=Math.max(...win),mn=Math.min(...win),a=mx-mn;
   if(a>AM[e.id]){if(stt==0&&ps<mn+.3*a)stt=1;else if(stt==1&&ps>mx-.3*a&&now-lastRep>500){cnt++;lastRep=now;stt=0;ping()}}}
  s.textContent='🟢 Counting'+(e.id=='burpee'?'':' · angle '+Math.round(ps)+'°')}
 $('#lc').textContent=cnt}
function sd(){const e=EX.find(x=>x.id==op),n=cnt;stopCam();ph=0;
 if(n>0){const t0=tgt(e),up=addLog(e,n),p=got(ds(0),e.id)/t0,r=rate(p);fb=`+${n} ${e.u} save! Rating: ${r[0]} — ${r[1]} (${Math.round(p*100)}%)`;sheet();if(e.gm&&gmChk(e))gmShow(e);else if(up)lu(e)}
 else{fb='Camera ne kuch count nahi kiya 😴 Phir try karo.';sheet()}}
function lu(e){const r=S.rw[S.rw.length-1];
 $('#mbc').innerHTML=`<div style="font-size:64px">${r.i}</div><h2>LEVEL UP! 🎉</h2><div>${e.n} → <b>Level ${lvl(e.id)}</b></div><div class="card"><b>${r.n}</b><br>${r.r}</div><div class="mu">Naya target: ${tgt(e)} ${e.u}</div><br><button onclick="$('#md').style.display='none';render()">Shabaash! 💪</button>`;
 $('#md').style.display='flex';
 for(let i=0;i<36;i++){const c=document.createElement('span');c.className='cf';c.textContent=['🎉','⭐','💪','🔥','🏆'][i%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
</script></body></html>
